version: 2
updates:
  - package-ecosystem: "swift"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    groups:
      swift:
        patterns: ["*"]
    labels:
      - "dependencies"
      - "swift"
    commit-message:
      prefix: "chore(deps)"
